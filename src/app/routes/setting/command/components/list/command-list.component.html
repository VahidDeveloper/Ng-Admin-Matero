<mat-card class="page-container">
  <mat-card-title>{{ 'pages.setting.command.title' | translate }}</mat-card-title>
  <mat-card-content>
    <div class="header-container d-flex justify-content-between">
      <mat-form-field class="search-field" appearance="outline">
        <input
          matInput
          [placeholder]="'search' | translate"
          [ngModel]="searchTerm$ | async"
          (ngModelChange)="updateSearch($event)"
        />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="add()">
        {{ 'add' | translate }}
      </button>
    </div>

    <div class="url-list">
      <mtx-grid
        [data]="(filteredRow$ | async)!"
        [columns]="columns"
        [length]="(count$ | async)!"
        [loading]="fetchLoading$ | async"
        [pageOnFront]="false"
        [rowHover]="true"
      />
    </div>
  </mat-card-content>
</mat-card>
