@if (fetchLoading$ | async) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="page-container">
  <div class="header-container">
    <mat-form-field class="search-field" appearance="outline">
      <input
        matInput
        [placeholder]="'search' | translate"
        [ngModel]="searchTerm$ | async"
        (ngModelChange)="updateSearch($event)"
      />
    </mat-form-field>

    <div class="count">
      <p>{{ 'total' | translate }}: {{ count$ | async }}</p>
    </div>

    <button mat-flat-button color="primary" (click)="add()">
      {{ 'add' | translate }}
    </button>
  </div>

  <div class="url-list">
    <cdk-virtual-scroll-viewport itemSize="20" class="viewport">
      <div class="url-item" *cdkVirtualFor="let item of filteredRow$ | async">
        <span>{{ item.name }}</span>
        <button mat-icon-button color="primary" (click)="delete(item)">
          <mat-icon [style.color]="'red'">delete</mat-icon>
        </button>
      </div>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
