<mat-card class="p-16">
  <mat-card-title>{{ 'pages.setting.password.title' | translate }}</mat-card-title>
  <mat-card-content>
    <mat-tab-group>
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="d-flex gap-4 align-items-center">
            <h3 class="custom-tab-title m-0">
              {{ 'pages.setting.password.personal' | translate }}
            </h3>
            <mat-icon
              class="custom-tab-description"
              [matTooltip]="'pages.setting.password.personal_description' | translate"
            >
              info
            </mat-icon>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <app-password-list />
        </ng-template>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="d-flex gap-4 align-items-center">
            <h3 class="m-0">
              {{ 'pages.setting.password.org' | translate }}
            </h3>
            <mat-icon
              class="custom-tab-description"
              [matTooltip]="'pages.setting.password.org_description' | translate"
            >
              info
            </mat-icon>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <app-org-password-list />
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
